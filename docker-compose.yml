# Local stack. Services are added phase by phase (see docs/02_Technical_Design.md §3):
#   Phase 1: tuition-api   Phase 2: mcp-server, kong   Phase 3: agent   Phase 4: web
name: tuition-assistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published only for local debugging; docker-compose.prod.yml has no postgres at all (RDS).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
