# Local stack. Services are added phase by phase (see docs/02_Technical_Design.md §3):
#   Phase 1: tuition-api   Phase 2: mcp-server, kong   Phase 3: agent   Phase 4: web
# Public entry point: Kong on http://localhost (GATEWAY_PORT, default 80).
name: tuition-assistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published only for local debugging; docker-compose.prod.yml has no postgres at all (RDS).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  tuition-api:
    build: ./services/tuition-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-60}
    depends_on:
      postgres:
        condition: service_healthy
    # No published port: REST traffic reaches the API only through Kong.

  mcp-server:
    build: ./services/mcp-server
    environment:
      MCP_ALLOWED_HOSTS: mcp-server:*,localhost:*,127.0.0.1:*
    # Local only, for MCP Inspector. Agents reach it inside the network at http://mcp-server:8100/mcp.
    ports:
      - "127.0.0.1:8100:8100"

  kong:
    build: ./gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      tuition-api:
        condition: service_started
    # The only public entry point for REST traffic. Set GATEWAY_PORT if port 80 is taken locally.
    ports:
      - "${GATEWAY_PORT:-80}:8000"

volumes:
  pgdata:
