# AWS stack (docs/04_Deployment_Guide.md). Differences from docker-compose.yml:
#   - no postgres service: DATABASE_URL points at Amazon RDS (TLS required)
#   - Caddy (ports 80/443) is the only published service: it terminates TLS for PUBLIC_DOMAIN with a
#     Let's Encrypt certificate and forwards everything to Kong; MCP, Kong and the services stay private
#   - every service restarts with the host, and container logs are size-capped
# Usage on the EC2 host:  bash scripts/deploy.sh   (or: docker compose -f docker-compose.prod.yml up -d --build)
name: tuition-assistant

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  tuition-api:
    <<: *service
    build: ./services/tuition-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the RDS endpoint}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-60}

  mcp-server:
    <<: *service
    build: ./services/mcp-server
    environment:
      MCP_ALLOWED_HOSTS: mcp-server:*
    # No published port: only the agent reaches it, at http://mcp-server:8100/mcp.

  agent:
    <<: *service
    build: ./services/agent
    environment:
      GATEWAY_URL: http://kong:8000
      MCP_URL: http://mcp-server:8100/mcp
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-flash-lite-latest,gemini-2.5-flash-lite}
    depends_on:
      mcp-server:
        condition: service_healthy

  web:
    <<: *service
    build: ./web

  kong:
    <<: *service
    build: ./gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      tuition-api:
        condition: service_healthy
      agent:
        condition: service_started
      web:
        condition: service_started
    # No published port: Caddy forwards to http://kong:8000.

  caddy:
    <<: *service
    image: caddy:2.10-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./gateway/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  caddy_data:
  caddy_config:
